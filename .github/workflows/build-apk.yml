name: Build Android APK (Z1 Movies)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Debug APK with Bun, Node 22 & Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22.x (Capacitor requirement)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Toolchain Environment
        run: |
          echo "Node.js version:"
          node -v
          echo "Bun version:"
          bun -v
          echo "Java version:"
          java -version

      - name: Install Dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build Web App
        run: bun run build

      - name: Initialize or Sync Capacitor Android Project
        run: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "Android project not found or incomplete. Adding Android platform via Capacitor..."
            rm -rf android
            bunx cap add android
          else
            echo "Existing Android project found."
          fi
          echo "Syncing Capacitor Android..."
          bunx cap sync android

      - name: Verify Capacitor Android Project Structure
        run: |
          echo "Verifying Android project structure..."
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Neither android/settings.gradle nor android/settings.gradle.kts found!"
            exit 1
          fi
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "ERROR: Neither android/build.gradle nor android/build.gradle.kts found!"
            exit 1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew not found!"
            exit 1
          fi
          if [ ! -d "android/gradle/wrapper" ]; then
            echo "ERROR: android/gradle/wrapper directory not found!"
            exit 1
          fi
          if [ ! -d "android/app" ]; then
            echo "ERROR: android/app directory not found!"
            exit 1
          fi
          echo "Capacitor Android project structure verified successfully."

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x ./android/gradlew
          ls -la ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./android/gradlew -p android assembleDebug --stacktrace

      - name: Find Generated APK
        id: find_apk
        run: |
          echo "Searching for generated APK files..."
          APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file was generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z1-Movies-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
