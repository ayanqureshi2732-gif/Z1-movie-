name: Build Android APK (Z1 Movies)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Debug APK with Bun, Node 22 & Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22.x (Capacitor requirement)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Toolchain Environment
        run: |
          echo "Node.js version:"
          node -v
          echo "Bun version:"
          bun -v
          echo "Java version:"
          java -version

      - name: Install Dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build Web App
        run: bun run build

      - name: Ensure Android Project and Capacitor Sync
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Android platform via Capacitor..."
            bunx cap add android
          else
            echo "Android directory exists. Syncing Capacitor..."
            bunx cap sync android
          fi

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew not found. Generating Gradle wrapper..."
            if ! command -v gradle &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y gradle
            fi
            (cd android && gradle wrapper)
          fi

          echo "Ensuring android/gradlew is executable..."
          chmod +x ./android/gradlew
          ls -la ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./android/gradlew -p android assembleDebug --stacktrace

      - name: Find Generated APK
        id: find_apk
        run: |
          echo "Searching for generated APK files..."
          APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file was generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z1-Movies-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
