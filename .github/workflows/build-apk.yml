name: Build Android APK (Z1 MOVIES)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "platforms;android-36" || true
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew not found. Initializing Capacitor Android platform..."
            if [ -d "android/app/src" ]; then
              mkdir -p /tmp/cap_backup
              cp -r android/app/src /tmp/cap_backup/ 2>/dev/null || true
              rm -rf android
              npx cap add android
              cp -r /tmp/cap_backup/src/* android/app/src/ 2>/dev/null || true
              rm -rf /tmp/cap_backup
            else
              rm -rf android
              npx cap add android
            fi
          fi
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          test -f android/gradlew
          chmod +x android/gradlew
          ls -l android/gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          cd android
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Z1-MOVIES-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
